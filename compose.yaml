name: technician-hub
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-technician_hub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.3.0}
        RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub_local_only}@db:5432/${POSTGRES_DB:-technician_hub}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      ALLOW_FAKE_PROVIDERS: ${ALLOW_FAKE_PROVIDERS:-false}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-disabled}
      TELEGRAM_EXPECTED_BOT_ID: ${TELEGRAM_EXPECTED_BOT_ID:-}
      TELEGRAM_EXPECTED_BOT_USERNAME: ${TELEGRAM_EXPECTED_BOT_USERNAME:-}
      TELEGRAM_INVITE_SECONDS: ${TELEGRAM_INVITE_SECONDS:-900}
      TELEGRAM_SENDER_MINUTE_LIMIT: ${TELEGRAM_SENDER_MINUTE_LIMIT:-30}
      TELEGRAM_SENDER_BURST_LIMIT: ${TELEGRAM_SENDER_BURST_LIMIT:-10}
      TELEGRAM_SENDER_BURST_SECONDS: ${TELEGRAM_SENDER_BURST_SECONDS:-10}
      TELEGRAM_GLOBAL_MINUTE_LIMIT: ${TELEGRAM_GLOBAL_MINUTE_LIMIT:-300}
      TELEGRAM_PROCESSED_UPDATE_RETENTION_DAYS: ${TELEGRAM_PROCESSED_UPDATE_RETENTION_DAYS:-7}
      WORK_REPORT_SESSION_SECONDS: ${WORK_REPORT_SESSION_SECONDS:-900}
      SCHEDULE_DELIVERY_ENABLED: ${SCHEDULE_DELIVERY_ENABLED:-false}
      SCHEDULE_PAYLOAD_ENCRYPTION_KEY: ${SCHEDULE_PAYLOAD_ENCRYPTION_KEY:-}
      SCHEDULE_AUTO_DELIVERY_LOCAL_TIME: ${SCHEDULE_AUTO_DELIVERY_LOCAL_TIME:-20:00}
      GOOGLE_MODE: ${GOOGLE_MODE:-disabled}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_CALENDAR_CREDENTIAL_ENCRYPTION_KEY: ${GOOGLE_CALENDAR_CREDENTIAL_ENCRYPTION_KEY:-}
      GOOGLE_OAUTH_MANAGER_LIMIT: ${GOOGLE_OAUTH_MANAGER_LIMIT:-5}
      GOOGLE_OAUTH_MANAGER_WINDOW_SECONDS: ${GOOGLE_OAUTH_MANAGER_WINDOW_SECONDS:-900}
      GOOGLE_OAUTH_GLOBAL_LIMIT: ${GOOGLE_OAUTH_GLOBAL_LIMIT:-20}
      GOOGLE_OAUTH_GLOBAL_WINDOW_SECONDS: ${GOOGLE_OAUTH_GLOBAL_WINDOW_SECONDS:-3600}
      GOOGLE_MANUAL_MANAGER_LIMIT: ${GOOGLE_MANUAL_MANAGER_LIMIT:-6}
      GOOGLE_MANUAL_MANAGER_WINDOW_SECONDS: ${GOOGLE_MANUAL_MANAGER_WINDOW_SECONDS:-600}
      GOOGLE_MANUAL_GLOBAL_LIMIT: ${GOOGLE_MANUAL_GLOBAL_LIMIT:-30}
      GOOGLE_MANUAL_GLOBAL_WINDOW_SECONDS: ${GOOGLE_MANUAL_GLOBAL_WINDOW_SECONDS:-3600}
      GOOGLE_OAUTH_ATTEMPT_RETENTION_DAYS: ${GOOGLE_OAUTH_ATTEMPT_RETENTION_DAYS:-7}
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn hub.main:app --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infrastructure/web.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.3.0}
        RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  telegram-worker:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.3.0}
        RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
    command: ["python", "-m", "hub.telegram.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub_local_only}@db:5432/${POSTGRES_DB:-technician_hub}
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-disabled}
      TELEGRAM_EXPECTED_BOT_ID: ${TELEGRAM_EXPECTED_BOT_ID:-}
      TELEGRAM_EXPECTED_BOT_USERNAME: ${TELEGRAM_EXPECTED_BOT_USERNAME:-}
      TELEGRAM_SENDER_MINUTE_LIMIT: ${TELEGRAM_SENDER_MINUTE_LIMIT:-30}
      TELEGRAM_SENDER_BURST_LIMIT: ${TELEGRAM_SENDER_BURST_LIMIT:-10}
      TELEGRAM_SENDER_BURST_SECONDS: ${TELEGRAM_SENDER_BURST_SECONDS:-10}
      TELEGRAM_GLOBAL_MINUTE_LIMIT: ${TELEGRAM_GLOBAL_MINUTE_LIMIT:-300}
      TELEGRAM_PROCESSED_UPDATE_RETENTION_DAYS: ${TELEGRAM_PROCESSED_UPDATE_RETENTION_DAYS:-7}
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram-bot-token.txt
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      WORK_REPORT_SESSION_SECONDS: ${WORK_REPORT_SESSION_SECONDS:-900}
      PTB_TIMEDELTA: "true"
    volumes:
      - ./.local/telegram-bot-token.txt:/run/secrets/telegram-bot-token.txt:ro
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 50s
    restart: "on-failure:5"
  schedule-worker:
    profiles: ["schedules"]
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.3.0}
        RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
    command: ["python", "-m", "hub.schedule_delivery.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub_local_only}@db:5432/${POSTGRES_DB:-technician_hub}
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      SCHEDULE_DELIVERY_ENABLED: ${SCHEDULE_DELIVERY_ENABLED:-false}
      SCHEDULE_PAYLOAD_ENCRYPTION_KEY: ${SCHEDULE_PAYLOAD_ENCRYPTION_KEY:-}
      SCHEDULE_AUTO_DELIVERY_LOCAL_TIME: ${SCHEDULE_AUTO_DELIVERY_LOCAL_TIME:-20:00}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-disabled}
      TELEGRAM_EXPECTED_BOT_ID: ${TELEGRAM_EXPECTED_BOT_ID:-}
      TELEGRAM_EXPECTED_BOT_USERNAME: ${TELEGRAM_EXPECTED_BOT_USERNAME:-}
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram-bot-token.txt
      GOOGLE_MODE: ${GOOGLE_MODE:-disabled}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_CALENDAR_CREDENTIAL_ENCRYPTION_KEY: ${GOOGLE_CALENDAR_CREDENTIAL_ENCRYPTION_KEY:-}
      PTB_TIMEDELTA: "true"
    volumes:
      - ./.local/telegram-bot-token.txt:/run/secrets/telegram-bot-token.txt:ro
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 50s
    restart: "on-failure:5"
  accounting-mirror-worker:
    profiles: ["accounting-mirrors"]
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.3.0}
        RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
    command: ["python", "-m", "hub.accounting_mirrors.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub_local_only}@db:5432/${POSTGRES_DB:-technician_hub}
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      GOOGLE_MODE: ${GOOGLE_MODE:-disabled}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_CALENDAR_CREDENTIAL_ENCRYPTION_KEY: ${GOOGLE_CALENDAR_CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s
    restart: "on-failure:5"
  test-db:
    profiles: ["test"]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub_test_only
      POSTGRES_DB: technician_hub_test
    ports:
      - "127.0.0.1:5437:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d technician_hub_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
