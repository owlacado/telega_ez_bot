name: technician-hub
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-technician_hub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub_local_only}@db:5432/${POSTGRES_DB:-technician_hub}
      APP_ENV: ${APP_ENV:-development}
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn hub.main:app --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: infrastructure/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
  test-db:
    profiles: ["test"]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub_test_only
      POSTGRES_DB: technician_hub_test
    ports:
      - "127.0.0.1:5437:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d technician_hub_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
