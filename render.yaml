# One web container (Caddy + Next.js + FastAPI), one combined worker, one TEST database.
# Provider modes stay disabled until a separately reviewed live-TEST activation change.
envVarGroups:
  - name: technician-hub-test-shared
    envVars:
      - key: APP_ENV
        value: pilot
      - key: APP_VERSION
        value: 0.3.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DEBUG
        value: "false"
      - key: ALLOW_FAKE_PROVIDERS
        value: "false"
      - key: TELEGRAM_MODE
        value: disabled
      - key: GOOGLE_MODE
        value: disabled
      - key: SCHEDULE_DELIVERY_ENABLED
        value: "false"

databases:
  - name: technician-hub-test-db
    databaseName: technician_hub_test_pilot
    user: technician_hub_test_pilot
    postgresMajorVersion: "18"
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []

services:
  - type: web
    name: technician-hub-test-web
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    numInstances: 1
    dockerContext: .
    dockerfilePath: infrastructure/render.Dockerfile
    dockerCommand: python -m hub.render_runtime web
    preDeployCommand: python -m hub.render_runtime migrate
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: technician-hub-test-shared
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: technician-hub-test-db
          property: connectionString
      - key: PUBLIC_APP_ORIGIN
        fromService:
          type: web
          name: technician-hub-test-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: worker
    name: technician-hub-test-worker
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    numInstances: 1
    dockerContext: .
    dockerfilePath: infrastructure/api.Dockerfile
    dockerCommand: python -m hub.render_runtime worker
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: technician-hub-test-shared
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: technician-hub-test-db
          property: connectionString
      - key: PUBLIC_APP_ORIGIN
        fromService:
          type: web
          name: technician-hub-test-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PTB_TIMEDELTA
        value: "true"
