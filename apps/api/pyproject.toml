[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "technician-hub-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.31", "pydantic>=2,<3", "pydantic-settings", "alembic", "argon2-cffi==25.1.0", "python-telegram-bot==22.8", "google-auth-oauthlib==1.4.1", "cryptography==50.0.1"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
