name: technician-hub-restart-test
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub_restart_test_only
      POSTGRES_DB: technician_hub_test
    ports: ["127.0.0.1:5444:5432"]
    volumes: ["restart_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d technician_hub_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    image: technician-hub-api
    environment:
      DATABASE_URL: postgresql+asyncpg://hub:hub_restart_test_only@db:5432/technician_hub_test
      APP_ENV: test
      ALLOWED_ORIGINS: '["http://127.0.0.1:3003"]'
      TELEGRAM_MODE: fake
      TELEGRAM_EXPECTED_BOT_ID: "9000001"
      TELEGRAM_EXPECTED_BOT_USERNAME: hub_dedicated_test_bot
      GOOGLE_MODE: fake
      GOOGLE_CALENDAR_CREDENTIAL_ENCRYPTION_KEY: h296Hlwktt4byynveKVcQuxX7eN8ty77nlor-a3Omyc=
      SCHEDULE_DELIVERY_ENABLED: "true"
      SCHEDULE_PAYLOAD_ENCRYPTION_KEY: 1ajUDMfGL53YFA8iShNsP-xjjA0YvMk_0QPLePP2uKs=
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn hub.main:app --host 0.0.0.0 --port 8000",
      ]
    ports: ["127.0.0.1:8003:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  web:
    image: technician-hub-web
    ports: ["127.0.0.1:3003:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  restart_data:
